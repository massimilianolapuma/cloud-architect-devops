# Runs the gates of `task verify` on every pull request and on main.
#
# `task verify` itself is not used here: its first step, `doctor`, requires the local test bed
# tools (docker, minikube, kubectl, helm, drawio), which a hosted runner does not all have.
# Each remaining gate runs as its own step, through the same Taskfile task as on a workstation,
# so a failure shows which gate broke. Keep the list equal to `verify` in Taskfile.yml, minus `doctor`.
#
# This workflow reports a result; it stops a merge only if the branch protection of the
# repository makes the job `gates` a required status check.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install the task runner
        run: npm install --global @go-task/cli@3.54.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 'Gate: unit tests of the gate scripts'
        run: task test:tools

      - name: 'Gate: content lint'
        run: task content:lint

      - name: 'Gate: code owners'
        run: task codeowners:check

      - name: 'Gate: EN/IT parity'
        run: task i18n:check

      - name: 'Gate: diagrams'
        run: task diagrams:check

      - name: 'Gate: interactive flows'
        run: task flows:check

      - name: 'Gate: agentic chain lint'
        run: task agentic:lint

      - name: 'Gate: site build (en, it)'
        run: task site:build
